server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 10m
      cookie:
        name: SESSION_ID
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: sparepart-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/sparepart?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# 业务参数
app:
  # 允许访问接口的前端地址，多个地址用逗号分隔
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # 仅首次部署时显式开启；创建完成后应立即关闭
  bootstrap-users-enabled: ${BOOTSTRAP_USERS_ENABLED:false}
  # 冷热分离：热数据保留月数
  log-hot-months: 6
  # TXT 导入批次大小
  import-batch-size: 500
